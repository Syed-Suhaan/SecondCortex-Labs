name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ""
  FRONTEND_IMAGE: ""
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Compute lowercase image names
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner_lc}/secondcortex-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lc}/secondcortex-frontend" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./secondcortex-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./secondcortex-web
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://sc-backend-suhaan.azurewebsites.net

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Compute lowercase image names
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${owner_lc}/secondcortex-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner_lc}/secondcortex-frontend" >> "$GITHUB_ENV"

      - name: Deploy Backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sc-backend-suhaan
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          images: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy Frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sc-frontend-suhaan
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          images: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Backend health check
        shell: bash
        run: |
          set -euo pipefail
          url="https://sc-backend-suhaan.azurewebsites.net/health"
          attempts=40
          delay=15

          echo "Waiting for backend App Service to finish pulling and starting the new container..."
          sleep 45

          for i in $(seq 1 "$attempts"); do
            response_file="$(mktemp)"
            code=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              "$url" || true)

            if [ "$code" = "200" ]; then
              echo "Backend health check passed"
              rm -f "$response_file"
              exit 0
            fi

            echo "Backend not ready yet (attempt $i/$attempts, status=$code)"
            if [ "$i" = "$attempts" ]; then
              echo "Backend health check failed. Last response body:"
              cat "$response_file" || true
              rm -f "$response_file"
              exit 1
            fi

            rm -f "$response_file"
            sleep "$delay"
          done

      - name: Frontend health check
        shell: bash
        run: |
          set -euo pipefail
          url="https://sc-frontend-suhaan.azurewebsites.net/"
          attempts=24
          delay=10

          for i in $(seq 1 "$attempts"); do
            code=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 20 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$url" || true)

            if [ "$code" = "200" ]; then
              echo "Frontend health check passed"
              exit 0
            fi

            echo "Frontend not ready yet (attempt $i/$attempts, status=$code)"
            if [ "$i" = "$attempts" ]; then
              echo "Frontend health check failed"
              exit 1
            fi

            sleep "$delay"
          done
